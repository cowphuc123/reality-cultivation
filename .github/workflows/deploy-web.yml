name: Đăng bản web

on:
  push:
    branches: [master]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cài phụ thuộc
        working-directory: client
        run: flutter pub get

      - name: Build bản web
        working-directory: client
        run: flutter build web --release --base-href /reality-cultivation/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/build/web

      - id: deployment
        uses: actions/deploy-pages@v4
